name: Deploy to EC2

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: Utils
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Deliberately not requirements.txt -- that file is a full pip freeze
      # of a local dev environment (torch, transformers, etc.), not scoped
      # to what the test suite actually imports.
      - name: Install test dependencies
        run: pip install pytest pymongo pdfplumber
      - name: Run tests
        env:
          MONGO_URI: mongodb://localhost:27017
        run: pytest -q
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/server/go.mod
      # Writes to its own "resumechecker_test" database in the same mongodb
      # service container above, so it can't collide with the pytest run's
      # data even though both share one container.
      - name: Run Go tests
        working-directory: backend/server
        env:
          MONGO_URI: mongodb://localhost:27017
        run: go test ./...

  deploy:
    needs: test
    # Only deploy on an actual merge to main -- pull_request events also
    # satisfy `needs: test`, so without this, every PR would try to SSH
    # into EC2 and deploy unmerged code.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            bash ~/resumechecker-repo/deploy.sh
