name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: Utils
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Deliberately not requirements.txt -- that file is a full pip freeze
      # of a local dev environment (torch, transformers, etc.), not scoped
      # to what the test suite actually imports.
      - name: Install test dependencies
        run: pip install pytest pymongo pdfplumber
      - name: Run tests
        env:
          MONGO_URI: mongodb://localhost:27017
        run: pytest -q

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            bash ~/resumechecker-repo/deploy.sh
